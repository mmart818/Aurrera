<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf6ec">
<title>¡Goazen!</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="¡Goazen!">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Si el frontend se aloja en otro dominio que el Worker, pon aquí la URL del Worker, sin barra final. -->
<script>window.API_BASE = '';</script>

<style>
  :root{
    --paper:#fbf6ec; --card:#fffdf8; --ink:#2f2a26; --mute:#6b625a; --line:#e8dec9;
    --sage:#8fae9a; --sage-l:#e3efe8; --sage-d:#3f6b57;
    --terra:#c8714f; --terra-l:#f7e2d8; --terra-d:#a4503a;
    --blue:#7aa7c7; --blue-l:#dfebf4; --blue-d:#2f5a7a;
    --gold:#e8b44c; --gold-l:#fbefcf;
    --r:18px; --shadow:0 1px 2px rgba(47,42,38,.06),0 6px 18px rgba(47,42,38,.07);
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; font-family:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:16px; line-height:1.45;
    color:var(--ink); background-color:var(--paper); min-height:100dvh; padding-bottom:calc(88px + var(--safe-b));
    background-image:
      radial-gradient(60% 40% at 8% 0%, rgba(122,167,199,.28), transparent 70%),
      radial-gradient(50% 35% at 100% 18%, rgba(200,113,79,.17), transparent 70%),
      radial-gradient(55% 40% at 0% 100%, rgba(143,174,154,.26), transparent 70%);
    background-attachment:fixed;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:500}
  button{font-family:inherit;font-size:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--blue-d);outline-offset:2px}
  [hidden]{display:none!important}
  .ico{display:inline-block;vertical-align:-3px;flex:none}

  /* ---------- Cabecera ---------- */
  .top{position:sticky;top:0;z-index:20;padding:calc(10px + var(--safe-t)) 16px 10px;
       background:rgba(251,246,236,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top-row{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:700;line-height:1.1}
  .sync{font-size:13px;color:var(--mute);margin-top:2px}
  .sync.bad{color:var(--terra-d)}
  .pot{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;background:var(--gold-l);border:1px solid #efd9a0;border-radius:999px}
  .pot-num{font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .pot.bump{animation:bump .45s ease-out}
  @keyframes bump{40%{transform:scale(1.08)}}
  .iconbtn{background:none;border:0;padding:8px;min-width:44px;min-height:44px;border-radius:12px;cursor:pointer;color:var(--mute);display:flex;align-items:center;justify-content:center}
  .iconbtn:hover{background:rgba(47,42,38,.06)}

  /* ---------- Contenido ---------- */
  .content{max-width:640px;margin:0 auto;padding:16px}
  .h2{font-size:20px;margin:22px 0 10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .between{justify-content:space-between}
  .grow{flex:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 6px;font-size:20px;line-height:1.2}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:#f3ecdd;color:var(--ink)}
  .d-easy{background:var(--sage-l);color:var(--sage-d)}
  .d-medium{background:var(--blue-l);color:var(--blue-d)}
  .d-hard{background:var(--terra-l);color:#8a3f26}
  .chip.gold{background:var(--gold-l);color:#6b4a07}
  .hint{font-size:14px;color:var(--mute);margin:6px 0}
  .note{margin:8px 0;padding:8px 12px;border-radius:12px;font-size:14px;background:var(--terra-l);color:#7a3520}
  .empty{padding:22px 12px;text-align:center;color:var(--mute)}
  .empty b{display:block;color:var(--ink);font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:18px;margin-bottom:4px}

  /* ---------- Botones ---------- */
  .btn{min-height:44px;padding:10px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);
       font-weight:700;cursor:pointer;text-align:center;line-height:1.2}
  .btn:hover{background:#f6efdf}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-main{background:var(--sage-d);border-color:var(--sage-d);color:#fff}
  .btn-main:hover{background:#355b4a}
  .btn-warm{background:var(--terra-d);border-color:var(--terra-d);color:#fff}
  .btn-warm:hover{background:#8f4430}
  .btn-soft{background:var(--terra-l);border-color:#efc9b9;color:#7a3520}
  .btn-sm{min-height:40px;padding:6px 14px;font-size:14px}
  .link{background:none;border:0;padding:6px 2px;color:var(--blue-d);font-weight:700;text-decoration:underline;cursor:pointer;font-size:14px;min-height:36px}

  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{font-weight:600;font-size:14px;padding:6px 14px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer}
  .pill[aria-pressed="true"]{background:var(--sage-d);border-color:var(--sage-d);color:#fff}

  /* ---------- Recompensas ---------- */
  .rw-top{display:flex;gap:12px;align-items:flex-start}
  .rw-ico{font-size:34px;line-height:1;width:56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:var(--gold-l);flex:none}
  .rw-cost{font-weight:700;display:flex;align-items:center;gap:6px}
  .bar{height:12px;border-radius:999px;background:#efe6d3;margin:10px 0 4px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),#d9993a);transition:width .5s ease}
  .bar.full > i{background:linear-gradient(90deg,var(--sage),var(--sage-d))}

  /* ---------- Navegación ---------- */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);
       background:rgba(255,253,248,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
       border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b))}
  .nav button{background:none;border:0;border-radius:14px;min-height:56px;cursor:pointer;color:var(--mute);font-weight:700;font-size:13px;
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .nav button[aria-current="page"]{color:var(--sage-d);background:var(--sage-l)}

  /* ---------- Modales ---------- */
  .modal-back{position:fixed;inset:0;z-index:50;background:rgba(47,42,38,.45);display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:560px){.modal-back{align-items:center}}
  .modal{width:100%;max-width:520px;max-height:94dvh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px calc(18px + var(--safe-b));box-shadow:var(--shadow)}
  @media(min-width:560px){.modal{border-radius:24px}}
  .modal h2{margin:0 0 6px;font-size:22px}
  .lbl{display:block;font-weight:700;font-size:14px;margin:14px 0 5px}
  .inp{width:100%;border:1px solid #d9cdb5;background:#fff;color:var(--ink);font:inherit;font-size:17px;padding:10px 12px;border-radius:12px}
  textarea.inp{min-height:84px;resize:vertical}
  .seg-row{display:flex;gap:8px}
  .seg{flex:1;cursor:pointer;position:relative}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg span{display:block;text-align:center;border:1px solid #d9cdb5;background:#fff;border-radius:12px;padding:8px 4px;font-size:14px;font-weight:600;line-height:1.25}
  .seg input:checked + span{background:var(--sage-l);border-color:var(--sage-d);color:var(--sage-d)}
  .seg input:focus-visible + span{outline:3px solid var(--blue-d);outline-offset:2px}
  .chk{display:flex;align-items:center;gap:10px;font-weight:600;margin:14px 0 6px}
  .chk input{width:20px;height:20px;accent-color:var(--sage-d)}
  .icons{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
  .icons button{font-size:22px;line-height:1;padding:6px 0;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;min-height:40px}
  .icons button[aria-pressed="true"]{background:var(--gold-l);border-color:var(--gold)}
  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .actions .btn{flex:1;min-width:110px}
  .danger-row{display:flex;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .danger-row .btn{flex:1}

  /* ---------- Celebración ---------- */
  .party{position:fixed;inset:0;z-index:60;background:rgba(47,42,38,.6);display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
  .party .box{position:relative;z-index:2;text-align:center;padding:26px 20px;max-width:400px;width:100%;background:var(--card);border-radius:28px;box-shadow:var(--shadow)}
  .party .big{font-size:64px;line-height:1;margin-bottom:8px}
  .party h2{font-size:26px;margin:0 0 6px}
  .party p{margin:0 0 6px;color:var(--mute)}
  .confetti{position:absolute;inset:0;pointer-events:none;z-index:1}
  .confetti i{position:absolute;top:-16px;width:10px;height:10px;border-radius:50%;opacity:.9;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) translateX(30px)}}

  /* ---------- Avisos ---------- */
  #toast-root{position:fixed;left:0;right:0;bottom:calc(84px + var(--safe-b));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
  .toast{pointer-events:auto;max-width:520px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:14px;
         background:var(--ink);color:#fff;box-shadow:var(--shadow);font-weight:600;animation:rise .25s ease-out}
  .toast.bad{background:var(--terra-d)} .toast.ok{background:var(--sage-d)}
  .toast button{background:rgba(255,255,255,.18);border:0;color:#fff;font-weight:700;padding:8px 14px;border-radius:10px;cursor:pointer;min-height:36px;flex:none}
  @keyframes rise{from{transform:translateY(8px);opacity:0}}

  /* ---------- Historial ---------- */
  .hist{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
  .hist:last-child{border-bottom:0}
  .hist .e{font-size:22px;width:30px;text-align:center;flex:none;line-height:1.3}
  .hist .amt{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:18px;white-space:nowrap}
  .hist.is-undone{opacity:.55}
  .pos{color:#2f6a4a} .neg{color:#a4503a}
  .when{font-size:13px;color:var(--mute)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .stats .card{margin:0;text-align:center;padding:12px}
  .stats span{font-size:14px;color:var(--mute)}
  .stats b{display:block;font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:700;margin-top:2px}

  @media (prefers-reduced-motion: reduce){
    .confetti{display:none} .pot.bump,.toast{animation:none} .bar > i{transition:none}
  }
</style>
</head>

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   Constantes y estado
   ===================================================================== */
const API_BASE = String(window.API_BASE || '').replace(/\/$/, '');
const KEY_CODE = 'bote.code';
const DIFF = {
  easy:   { label: 'Fácil',   coins: 10, cls: 'd-easy' },
  medium: { label: 'Media',   coins: 25, cls: 'd-medium' },
  hard:   { label: 'Difícil', coins: 50, cls: 'd-hard' },
};
const ICONS = ['🍰','🍫','🍕','🍣','☕','🍷','🍿','🛍️','🎨','🖌️','🧶','✂️','📚','🎧','🎮','🎬','🎟️','🌅','🏖️','🧳','🚲','🛁','🕯️','🪴','🎁','🎉','👟','🏊','🎒','📷','🧩','🍦'];
const NAV_ICONS = {
  tasks: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  rewards: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
  history: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
};

const S = {
  state: null, tab: 'tasks', filter: 'all', rview: 'active', hview: 'tasks',
  showDone: false, showArch: false,
  busy: false, loading: false, online: true, lastSync: null,
  code: '', shown: null, error: null, codeOpen: false,
};
try { S.code = localStorage.getItem(KEY_CODE) || ''; } catch (e) { /* sin almacenamiento: funciona igual */ }

/* =====================================================================
   Utilidades
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n) => `${n} ${n === 1 ? 'moneda' : 'monedas'}`;
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
const fmtDay = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }); };
const fmtDT = (iso) => new Date(iso).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const monthLabel = (iso) => new Date(iso).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
const bonusCoins = (t) => Math.round(DIFF[t.difficulty].coins * (1 + t.bonusPct / 100));
const svgIcon = (inner, px = 22) => `<svg width="${px}" height="${px}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const coin = (px = 20) => `<svg class="ico" width="${px}" height="${px}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#e8b44c" stroke="#b9852a" stroke-width="1.5"/><circle cx="12" cy="12" r="7" fill="none" stroke="#f6d78a" stroke-width="1.5"/><path d="M12 7.5v9M9.8 9.6c0-1 1-1.6 2.2-1.6s2.2.6 2.2 1.6-1 1.5-2.2 1.9-2.2.9-2.2 1.9 1 1.6 2.2 1.6 2.2-.6 2.2-1.6" fill="none" stroke="#b9852a" stroke-width="1.3" stroke-linecap="round"/></svg>`;

/* =====================================================================
   API
   ===================================================================== */
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (S.code) headers['X-App-Code'] = S.code;
  if (location.protocol === 'file:' && !API_BASE) {
    const er = new Error('Abre la app desde su URL de Cloudflare, no como archivo local (hace falta la API).'); er.code = 'net'; throw er;
  }
  let res;
  try {
    res = await fetch(API_BASE + path, { ...opts, headers, cache: 'no-store' });
  } catch (e) {
    const er = new Error('Sin conexión con el servidor'); er.code = 'net'; throw er;
  }
  let data = null;
  try { data = await res.json(); } catch (e) { /* sin cuerpo */ }
  if (res.status === 401) {
    openCodeModal();
    const er = new Error('Hace falta el código de acceso'); er.code = 'auth'; throw er;
  }
  if (!res.ok) {
    let msg = data && data.error;
    if (!msg && res.status === 404) msg = 'No se encuentra la API (/api/state). Esta URL solo sirve la página: falta desplegar el Worker o la Pages Function (mira el README).';
    const er = new Error(msg || `Error ${res.status}`); er.code = 'http'; throw er;
  }
  return data;
}

function describe(h) {
  switch (h.type) {
    case 'completed':          return `Completaste «${h.title}» (+${plural(h.coins)})${h.undone ? ' (deshecha)' : ''}`;
    case 'completion_undone':  return `Deshiciste «${h.title}» (−${plural(h.coins)})`;
    case 'redeemed':           return `Canjeaste «${h.title}» (−${plural(h.coins)})${h.undone ? ' (deshecho)' : ''}`;
    case 'redeem_undone':      return `Deshiciste el canje de «${h.title}» (+${plural(h.coins)})`;
    case 'penalized':          return `Penalización: «${h.title}» (−${h.applied}${h.applied < h.coins ? ', el bote llegó a 0' : ''})${h.undone ? ' (deshecha)' : ''}`;
    case 'penalty_undone':     return `Deshiciste la penalización «${h.title}» (+${plural(h.coins)})`;
    default: return h.title || '';
  }
}

function applyState(st) {
  const prev = S.state;
  if (prev && st.version < prev.version) return; // respuesta más antigua que la que ya tenemos
  const changed = !prev || prev.version !== st.version;
  S.state = st; S.error = null;
  if (changed) render();
}

async function refresh({ silent = false } = {}) {
  if (S.loading) return;
  S.loading = true;
  try {
    const res = await api('/api/state?_=' + Date.now());
    S.online = true; S.lastSync = new Date();
    applyState(res.state);
  } catch (err) {
    S.online = false;
    if (err.code === 'auth') { /* se abre el modal de código */ }
    else if (!S.state) { S.error = err.message; render(); }
    else if (!silent) toast(err.message, 'bad');
  } finally {
    S.loading = false; updateSync();
  }
}

async function act(action, payload = {}) {
  if (S.busy) return null;
  S.busy = true;
  try {
    const res = await api('/api/action', { method: 'POST', body: JSON.stringify({ action, payload }) });
    S.online = true; S.lastSync = new Date();
    applyState(res.state); updateSync();
    return res.result || {};
  } catch (err) {
    if (err.code !== 'auth') toast(err.message || 'No se pudo completar la acción', 'bad');
    S.busy = false;
    refresh({ silent: true });
    return null;
  } finally {
    S.busy = false;
  }
}

/* =====================================================================
   Render
   ===================================================================== */
function render() {
  const root = $('#app');
  if (!S.state) {
    root.innerHTML = `<main class="content" style="text-align:center;padding-top:80px">
      <h1 class="serif" style="font-size:30px;margin:0 0 8px">Mi bote</h1>
      <p class="hint">${S.error ? esc(S.error) : 'Cargando…'}</p>
      ${S.error ? '<button class="btn btn-main" data-a="refresh">Reintentar</button>' : ''}</main>`;
    return;
  }
  root.innerHTML = renderHeader() + `<main class="content" id="content">${renderTab()}</main>` + renderNav();
  animatePot(); updateSync();
}

function renderHeader() {
  return `<header class="top"><div class="top-row">
    <div><div class="brand">Mi bote</div><div class="sync" id="sync"></div></div>
    <div class="row" style="flex-wrap:nowrap;gap:4px">
      <button class="iconbtn" data-a="refresh" aria-label="Actualizar ahora">${svgIcon('<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>', 20)}</button>
      <div class="pot" id="pot-box">${coin(26)}<span class="pot-num" id="pot-num" aria-label="Monedas en el bote">${S.shown ?? S.state.coins}</span></div>
    </div></div></header>`;
}

function renderNav() {
  const tabs = [['tasks', 'Tareas'], ['rewards', 'Premios'], ['history', 'Historial']];
  return `<nav class="nav" aria-label="Secciones">${tabs.map(([k, l]) =>
    `<button data-a="tab" data-t="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${svgIcon(NAV_ICONS[k])}<span>${l}</span></button>`).join('')}</nav>`;
}

function renderTab() {
  return S.tab === 'rewards' ? renderRewards() : S.tab === 'history' ? renderHistory() : renderTasks();
}

function updateSync() {
  const el = $('#sync');
  if (!el) return;
  if (!S.online) { el.className = 'sync bad'; el.textContent = 'Sin conexión, reintentando…'; return; }
  el.className = 'sync';
  el.textContent = S.lastSync ? `Guardado en la nube · ${S.lastSync.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}` : 'Sincronizando…';
}

let tweenId = 0;
function animatePot() {
  const el = $('#pot-num');
  if (!el) return;
  const id = ++tweenId; // cualquier animación anterior queda cancelada
  const to = S.state.coins;
  const from = S.shown ?? to;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (from === to || reduce) { el.textContent = to; S.shown = to; return; }
  const box = $('#pot-box'); box.classList.remove('bump'); void box.offsetWidth; box.classList.add('bump');
  const t0 = performance.now(), dur = 650;
  const step = (now) => {
    if (id !== tweenId) return;
    const k = Math.min(1, (now - t0) / dur);
    const val = Math.round(from + (to - from) * k);
    S.shown = val;
    const node = $('#pot-num'); if (node) node.textContent = val;
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------------------------- Tareas ---------------------------- */
function taskChips(t) {
  const d = DIFF[t.difficulty];
  const c = [`<span class="chip ${d.cls}">${d.label} · ${coin(14)} ${d.coins}</span>`,
             `<span class="chip">${t.type === 'recurring' ? 'Recurrente' : 'Puntual'}</span>`];
  if (t.type === 'once' && t.deadline && t.bonusPct > 0) {
    c.push(todayStr() > t.deadline
      ? `<span class="chip">Plazo vencido el ${fmtDay(t.deadline)}</span>`
      : `<span class="chip gold">Hasta el ${fmtDay(t.deadline)}: ${coin(14)} ${bonusCoins(t)}</span>`);
  }
  if (t.doneCount) c.push(`<span class="chip">Hecha ${t.doneCount} ${t.doneCount === 1 ? 'vez' : 'veces'}</span>`);
  return `<div class="chips">${c.join('')}</div>`;
}

function taskCard(t, mode) {
  let btns = '';
  if (mode === 'avail') {
    btns = `<button class="btn btn-main grow" data-a="complete" data-id="${t.id}">¡Hecho!</button>
            <button class="btn btn-sm" data-a="editTask" data-id="${t.id}" aria-label="Editar ${esc(t.title)}">Editar</button>`;
  } else if (mode === 'done') {
    btns = `<button class="btn btn-sm" data-a="reopen" data-id="${t.id}">Reabrir</button>
            <button class="btn btn-sm" data-a="archiveTask" data-id="${t.id}">Archivar</button>`;
  } else {
    btns = `<button class="btn btn-sm btn-main" data-a="unarchiveTask" data-id="${t.id}">Reactivar</button>
            <button class="btn btn-sm" data-a="editTask" data-id="${t.id}">Editar</button>`;
  }
  return `<article class="card"><h3>${esc(t.title)}</h3>${taskChips(t)}<div class="row">${btns}</div></article>`;
}

function renderTasks() {
  const all = S.state.tasks;
  const live = all.filter((t) => !t.archived);
  const done = live.filter((t) => t.status === 'done');
  const archived = all.filter((t) => t.archived);
  const avail = live.filter((t) => t.status === 'available' && (S.filter === 'all' || t.difficulty === S.filter))
    .map((t, i) => ({ t, i }))
    .sort((a, b) => {
      const da = a.t.deadline && a.t.bonusPct > 0 ? a.t.deadline : '9999';
      const db = b.t.deadline && b.t.bonusPct > 0 ? b.t.deadline : '9999';
      return da === db ? a.i - b.i : da < db ? -1 : 1;
    }).map((x) => x.t);
  const pill = (k, l) => `<button class="pill" data-a="filter" data-f="${k}" aria-pressed="${S.filter === k}">${l}</button>`;
  return `
    <div class="row between" style="margin-bottom:12px">
      <div class="pills">${pill('all', 'Todas')}${pill('easy', 'Fácil')}${pill('medium', 'Media')}${pill('hard', 'Difícil')}</div>
    </div>
    <div class="row" style="margin-bottom:6px;gap:8px">
      <button class="btn btn-main btn-sm" data-a="newTask">Nueva tarea</button>
      <button class="btn btn-soft btn-sm" data-a="penalty">Penalizar</button>
    </div>
    <h2 class="h2">Por hacer (${avail.length})</h2>
    ${avail.length ? avail.map((t) => taskCard(t, 'avail')).join('')
      : `<div class="card empty"><b>Nada pendiente</b>${S.filter === 'all' ? 'No quedan tareas disponibles. Crea una nueva o reabre una completada.' : 'No hay tareas con esta dificultad.'}</div>`}
    ${done.length ? `<div style="margin-top:14px"><button class="pill" data-a="toggleDone" aria-pressed="${S.showDone}">Completadas (${done.length})</button>
       ${S.showDone ? `<div style="margin-top:12px">${done.map((t) => taskCard(t, 'done')).join('')}</div>` : ''}</div>` : ''}
    ${archived.length ? `<div style="margin-top:10px"><button class="pill" data-a="toggleArch" aria-pressed="${S.showArch}">Archivadas (${archived.length})</button>
       ${S.showArch ? `<div style="margin-top:12px">${archived.map((t) => taskCard(t, 'archived')).join('')}</div>` : ''}</div>` : ''}`;
}

/* ---------------------------- Recompensas ---------------------------- */
function rewardCard(r) {
  const have = S.state.coins, missing = Math.max(0, r.cost - have);
  const pct = Math.min(100, Math.round((have / r.cost) * 100));
  const ok = missing === 0;
  const times = r.timesRedeemed ? ` Ya la disfrutaste ${r.timesRedeemed} ${r.timesRedeemed === 1 ? 'vez' : 'veces'}.` : '';
  if (r.archived) {
    return `<article class="card"><div class="rw-top"><div class="rw-ico" aria-hidden="true">${esc(r.icon)}</div><div class="grow"><h3>${esc(r.title)}</h3>
      <div class="rw-cost">${coin(18)} ${plural(r.cost)}</div>${times ? `<p class="hint">${times.trim()}</p>` : ''}</div></div>
      <div class="row" style="margin-top:10px"><button class="btn btn-main grow" data-a="unarchiveReward" data-id="${r.id}">Reactivar</button>
      <button class="btn btn-sm" data-a="editReward" data-id="${r.id}">Editar</button></div></article>`;
  }
  return `<article class="card"><div class="rw-top"><div class="rw-ico" aria-hidden="true">${esc(r.icon)}</div><div class="grow">
      <h3>${esc(r.title)}</h3>${r.description ? `<p class="hint" style="margin-top:0">${esc(r.description)}</p>` : ''}
      <div class="rw-cost">${coin(18)} ${plural(r.cost)}</div></div></div>
    <div class="bar ${ok ? 'full' : ''}" role="progressbar" aria-valuemin="0" aria-valuemax="${r.cost}" aria-valuenow="${Math.min(have, r.cost)}"><i style="width:${pct}%"></i></div>
    <p class="hint" style="margin-top:2px">${ok ? '¡Lista para canjear!' : `Te faltan ${plural(missing)}.`}${times}</p>
    <div class="row"><button class="btn ${ok ? 'btn-main' : ''} grow" data-a="redeem" data-id="${r.id}" ${ok ? '' : 'disabled'}>Canjear</button>
    <button class="btn btn-sm" data-a="editReward" data-id="${r.id}">Editar</button>
    <button class="btn btn-sm" data-a="archiveReward" data-id="${r.id}">Archivar</button></div></article>`;
}

function renderRewards() {
  const act_ = S.state.rewards.filter((r) => !r.archived).sort((a, b) => a.cost - b.cost);
  const arch = S.state.rewards.filter((r) => r.archived).sort((a, b) => a.cost - b.cost);
  const list = S.rview === 'active' ? act_ : arch;
  return `<div class="row between" style="margin-bottom:14px">
      <div class="pills">
        <button class="pill" data-a="rview" data-v="active" aria-pressed="${S.rview === 'active'}">Activas (${act_.length})</button>
        <button class="pill" data-a="rview" data-v="archived" aria-pressed="${S.rview === 'archived'}">Archivadas (${arch.length})</button>
      </div>
      <button class="btn btn-main btn-sm" data-a="newReward">Nueva</button>
    </div>
    ${list.length ? list.map(rewardCard).join('')
      : `<div class="card empty"><b>${S.rview === 'active' ? 'Sin recompensas activas' : 'El cajón está vacío'}</b>${S.rview === 'active' ? 'Añade una o reactiva alguna archivada.' : 'Las recompensas que archives aparecerán aquí.'}</div>`}`;
}

/* ---------------------------- Historial ---------------------------- */
function renderCompletions() {
  const list = S.state.completions || [];
  if (!list.length) return `<div class="card empty"><b>Aún no hay tareas completadas</b>Cada tarea que completes quedará registrada aquí.</div>`;
  const total = list.filter((c) => !c.undone).length;
  let html = `<div class="chips" style="margin-bottom:6px"><span class="chip">Completadas: ${total}</span></div>`;
  let cur = null, rows = '', sum = 0, n = 0;
  const flush = () => { if (cur !== null) html += `<h2 class="h2">${esc(cur)} <span class="when">(${n} ${n === 1 ? 'tarea' : 'tareas'}, +${sum})</span></h2><div class="card">${rows}</div>`; };
  list.forEach((c) => {
    const m = monthLabel(c.at);
    if (m !== cur) { flush(); cur = m; rows = ''; sum = 0; n = 0; }
    if (c.undone) {
      rows += `<div class="hist is-undone"><span class="e" aria-hidden="true">↩️</span><div class="grow"><s>${esc(c.title)}</s><div class="when">Deshecha. ${fmtDT(c.at)}</div></div></div>`;
    } else {
      sum += c.coins; n += 1;
      rows += `<div class="hist"><span class="e" aria-hidden="true">✅</span><div class="grow">${esc(c.title)}
        <div class="when">${fmtDT(c.at)}${c.onTime ? '. Con bonus a tiempo' : ''}</div>
        <button class="link" data-a="undoComplete" data-id="${c.id}">Deshacer</button></div>
        <span class="amt pos">+${c.coins}</span></div>`;
    }
  });
  flush();
  return html;
}

function renderRedemptions() {
  const list = S.state.redemptions || [];
  if (!list.length) return `<div class="card empty"><b>Aún no has canjeado nada</b>Las recompensas que canjees quedarán aquí, con opción de deshacer.</div>`;
  const ok = list.filter((r) => !r.undone);
  const spent = ok.reduce((a, r) => a + r.coins, 0);
  const rows = list.map((r) => r.undone
    ? `<div class="hist is-undone"><span class="e" aria-hidden="true">${esc(r.icon || '🎁')}</span><div class="grow"><s>${esc(r.title)}</s><div class="when">Deshecho. Las monedas volvieron al bote.</div></div></div>`
    : `<div class="hist"><span class="e" aria-hidden="true">${esc(r.icon || '🎁')}</span><div class="grow">${esc(r.title)}
        <div class="when">${fmtDT(r.at)}</div><button class="link" data-a="undoRedeem" data-id="${r.id}">Deshacer canje</button></div>
        <span class="amt neg">−${r.coins}</span></div>`).join('');
  return `<div class="chips" style="margin-bottom:10px"><span class="chip">Canjes: ${ok.length}</span><span class="chip gold">${coin(14)} Gastadas: ${spent}</span></div><div class="card">${rows}</div>`;
}

function renderPenalties() {
  const list = S.state.penalties || [];
  const active = list.filter((p) => !p.undone).length;
  const head = `<div class="chips" style="margin-bottom:10px"><span class="chip">Marcadas: ${active}</span><span class="chip gold">${coin(14)} Penalizado: ${S.state.totals.penalized || 0}</span></div>`;
  if (!list.length) return head + `<div class="card empty"><b>Sin penalizaciones</b>Las que marques quedarán aquí, con opción de deshacer.</div>`;
  const rows = list.map((p) => p.undone
    ? `<div class="hist is-undone"><span class="e" aria-hidden="true">↩️</span><div class="grow"><s>${esc(p.title)}</s><div class="when">Deshecha. Volvieron ${plural(p.applied)} al bote.</div></div></div>`
    : `<div class="hist"><span class="e" aria-hidden="true">⚠️</span><div class="grow">${esc(p.title)}
        <div class="when">${fmtDT(p.at)}.${p.applied < p.amount ? ` Solo se restó lo que había en el bote (${p.applied}).` : ''}</div>
        <button class="link" data-a="undoPenalty" data-id="${p.id}">Deshacer</button></div>
        <span class="amt neg">−${p.applied}</span></div>`).join('');
  return head + `<div class="card">${rows}</div>`;
}

function renderActivity() {
  const items = S.state.history;
  const icon = { completed: '✅', completion_undone: '↩️', redeemed: '🎉', redeem_undone: '↩️', penalized: '⚠️', penalty_undone: '↩️' };
  const amt = (h) => h.type === 'completed' ? `<span class="amt pos">+${h.coins}</span>`
    : h.type === 'redeemed' ? `<span class="amt neg">−${h.coins}</span>`
    : h.type === 'penalized' ? `<span class="amt neg">−${h.applied}</span>`
    : h.type === 'completion_undone' ? `<span class="amt neg">−${h.coins}</span>`
    : `<span class="amt pos">+${h.coins}</span>`;
  return `<div class="card">${items.length ? items.map((h) => `<div class="hist"><span class="e" aria-hidden="true">${icon[h.type] || '•'}</span>
      <div class="grow">${esc(describe(h))}<div class="when">${fmtDT(h.at)}</div></div>${amt(h)}</div>`).join('')
    : '<div class="empty"><b>Aún no hay nada</b>Aquí quedará tu actividad.</div>'}</div>`;
}

function renderHistory() {
  const st = S.state;
  const pill = (k, l) => `<button class="pill" data-a="hview" data-v="${k}" aria-pressed="${S.hview === k}">${l}</button>`;
  const body = S.hview === 'rewards' ? renderRedemptions() : S.hview === 'penalties' ? renderPenalties()
    : S.hview === 'activity' ? renderActivity() : renderCompletions();
  return `<div class="stats">
      <div class="card"><span>Monedas ganadas</span><b class="pos">${st.totals.earned}</b></div>
      <div class="card"><span>Monedas gastadas</span><b class="neg">${st.totals.spent}</b></div></div>
    <div class="pills" style="margin-bottom:14px">${pill('tasks', 'Tareas')}${pill('rewards', 'Premios')}${pill('penalties', 'Penalizaciones')}${pill('activity', 'Actividad')}</div>
    ${body}`;
}

    <input class="inp" id="pt-title" type="text" maxlength="60" autocomplete="off" value="${esc(v.title)}" placeholder="Ej.: Saltarme el día de correr">
    <div class="lbl">Cantidad</div>
    <div class="seg-row">${Object.entries(DIFF).map(([k, d]) =>
      `<label class="seg"><input type="radio" name="pt-diff" value="${k}" ${v.difficulty === k ? 'checked' : ''}><span>${d.label}<br>${d.coins} monedas</span></label>`).join('')}</div>
    <div class="actions"><button type="button" class="btn" data-a="penaltyList">Cancelar</button><button type="submit" class="btn btn-main">Guardar</button></div>
    ${t ? `<div class="danger-row"><button type="button" class="btn btn-sm btn-soft" data-a="deletePenaltyType" data-id="${t.id}">Quitar de la lista</button></div>` : ''}
  </form></div>`);
}

function celebrate(reward, redemptionId) {
  const colors = ['#e8b44c', '#8fae9a', '#c8714f', '#7aa7c7', '#f3d9a4', '#fffdf8'];
  const bits = Array.from({ length: 40 }, () =>
    `<i style="left:${Math.random() * 100}%;background:${colors[Math.floor(Math.random() * colors.length)]};width:${6 + Math.random() * 8}px;height:${6 + Math.random() * 8}px;animation-duration:${(2 + Math.random() * 2).toFixed(2)}s;animation-delay:${(Math.random() * 0.8).toFixed(2)}s"></i>`).join('');
  openModal(`<div class="party" role="dialog" aria-modal="true" aria-labelledby="party-t"><div class="confetti" aria-hidden="true">${bits}</div>
    <div class="box"><div class="big" aria-hidden="true">${esc(reward.icon)}</div>
    <h2 id="party-t">¡Recompensa lograda!</h2><p>A disfrutar: «${esc(reward.title)}»</p>
    <div class="actions"><button class="btn btn-main" data-a="closeModal">A disfrutar</button>
    <button class="btn btn-sm" data-a="partyArchive" data-id="${reward.id}">Archivarla</button></div>
    <div style="margin-top:8px"><button class="link" data-a="undoNow" data-id="${redemptionId}">Me he equivocado: deshacer canje</button></div></div></div>`);
}

/* =====================================================================
   Avisos
   ===================================================================== */
function toast(msg, kind = '', action = null) {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  const span = document.createElement('span'); span.textContent = msg; el.appendChild(span);
  if (action) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label;
    b.addEventListener('click', () => { el.remove(); action.fn(); });
    el.appendChild(b);
  }
  const root = $('#toast-root');
  root.innerHTML = ''; // un solo aviso a la vez: el nuevo sustituye al anterior (el deshacer sigue en Historial)
  root.appendChild(el);
  setTimeout(() => el.remove(), action ? 7000 : 4200);
}

/* =====================================================================
   Acciones de la interfaz
   ===================================================================== */
async function doUndoComplete(id) {
  const r = await act('undoComplete', { completionId: id });
  if (r) toast(`Tarea deshecha: −${plural(r.coins)}`, 'ok');
}

const A = {
  refresh() { refresh(); },
  tab(d) { S.tab = d.t; render(); window.scrollTo(0, 0); refresh({ silent: true }); },
  filter(d) { S.filter = d.f; render(); },
  rview(d) { S.rview = d.v; render(); },
  hview(d) { S.hview = d.v; render(); },
  toggleDone() { S.showDone = !S.showDone; render(); },
  toggleArch() { S.showArch = !S.showArch; render(); },
  closeModal() { closeModal(); },
  backdrop(d, e, el) { if (e.target === el) closeModal(); },

  async complete(d) {
    const r = await act('completeTask', { taskId: d.id });
    if (r) toast(`+${plural(r.coins)} al bote`, 'ok', { label: 'Deshacer', fn: () => doUndoComplete(r.completionId) });
  },
  async undoComplete(d) {
    if (!confirm('¿Deshacer esta tarea? Se restan sus monedas del bote.')) return;
    await doUndoComplete(d.id);
  },

  newTask() { taskModal(null); },
  editTask(d) { taskModal(d.id); },
  async saveTask(d) {
    const title = ($('#f-title').value || '').trim();
    if (!title) { toast('Ponle un nombre a la tarea.', 'bad'); return; }
    const type = $('input[name=f-type]:checked').value;
    const task = { id: d.id || undefined, title, difficulty: $('input[name=f-diff]:checked').value, type, deadline: null, bonusPct: 0 };
    if (type === 'once' && $('#f-hasdl').checked) {
      const date = $('#f-date').value;
      if (!date) { toast('Elige la fecha límite o desmarca el bonus.', 'bad'); return; }
      task.deadline = date; task.bonusPct = Number($('#f-bonus').value) || 0;
    }
    const r = await act('saveTask', { task });
    if (r) { closeModal(); toast('Tarea guardada', 'ok'); }
  },
  async archiveTask(d) { await act('archiveTask', { taskId: d.id, archived: true }); },
  async unarchiveTask(d) { await act('archiveTask', { taskId: d.id, archived: false }); },
  async archiveFromModal(d) { const r = await act('archiveTask', { taskId: d.id, archived: true }); if (r) closeModal(); },
  async reopen(d) { await act('reopenTask', { taskId: d.id }); },
  async deleteTask(d) {
    if (!confirm('¿Eliminar esta tarea para siempre? Si solo quieres quitarla de la lista, usa Archivar.')) return;
    const r = await act('deleteTask', { taskId: d.id }); if (r) closeModal();
  },

  newReward() { rewardModal(null); },
  editReward(d) { rewardModal(d.id); },
  pickIcon(d) {
    $('#r-icon').value = d.i;
    document.querySelectorAll('.icons button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.i === d.i)));
  },
  async saveReward(d) {
    const title = ($('#r-title').value || '').trim();
    const cost = Number($('#r-cost').value);
    if (!title) { toast('Ponle un título a la recompensa.', 'bad'); return; }
    if (!Number.isFinite(cost) || cost < 1) { toast('El coste tiene que ser de 1 moneda o más.', 'bad'); return; }
    const r = await act('saveReward', { reward: { id: d.id || undefined, icon: ($('#r-icon').value || '🎁').trim(), title, description: $('#r-desc').value, cost } });
    if (r) { closeModal(); toast('Recompensa guardada', 'ok'); }
  },
  async archiveReward(d) { await act('archiveReward', { rewardId: d.id, archived: true }); },
  async unarchiveReward(d) { await act('archiveReward', { rewardId: d.id, archived: false }); },
  async archiveRewardFromModal(d) {
    const cur = S.state.rewards.find((x) => x.id === d.id);
    const r = await act('archiveReward', { rewardId: d.id, archived: !cur.archived }); if (r) closeModal();
  },
  async deleteReward(d) {
    if (!confirm('¿Eliminar esta recompensa para siempre? Si quieres guardarla para más adelante, usa Archivar.')) return;
    const r = await act('deleteReward', { rewardId: d.id }); if (r) closeModal();
  },
  async redeem(d) {
    const r = await act('redeemReward', { rewardId: d.id });
    if (r && r.reward) celebrate(r.reward, r.redemptionId);
  },
  async undoRedeem(d) {
    if (!confirm('¿Deshacer este canje? Las monedas vuelven al bote.')) return;
    const r = await act('undoRedeem', { redemptionId: d.id });
    if (r) toast(`Canje deshecho: +${plural(r.coins)} al bote`, 'ok');
  },
  async undoNow(d) {
    const r = await act('undoRedeem', { redemptionId: d.id });
    if (r) { closeModal(); toast(`Canje deshecho: +${plural(r.coins)} al bote`, 'ok'); }
  },
  async partyArchive(d) { closeModal(); await act('archiveReward', { rewardId: d.id, archived: true }); },

  penalty() { penaltyPickModal(); },
  penaltyList() { penaltyListModal(); },
  newPenaltyType() { penaltyTypeModal(null); },
  editPenaltyType(d) { penaltyTypeModal(d.id); },
  async applyPenalty(d) {
    const r = await act('applyPenalty', { typeId: d.id });
    if (!r) return;
    closeModal();
    if (r.applied > 0) toast(`−${plural(r.applied)} del bote`, 'bad', { label: 'Deshacer', fn: async () => {
      const u = await act('undoPenalty', { penaltyId: r.penaltyId });
      if (u) toast(`Penalización deshecha: +${plural(u.applied)}`, 'ok');
    } });
    else toast('El bote ya estaba a 0');
  },
  async undoPenalty(d) {
    if (!confirm('¿Deshacer esta penalización? Las monedas vuelven al bote.')) return;
    const r = await act('undoPenalty', { penaltyId: d.id });
    if (r) toast(`Penalización deshecha: +${plural(r.applied)} al bote`, 'ok');
  },
  async savePenaltyType(d) {
    const title = ($('#pt-title').value || '').trim();
    if (!title) { toast('Ponle un nombre a la penalización.', 'bad'); return; }
    const r = await act('savePenaltyType', { type: { id: d.id || undefined, title, difficulty: $('input[name=pt-diff]:checked').value } });
    if (r) { penaltyListModal(); toast('Penalización guardada', 'ok'); }
  },
  async deletePenaltyType(d) {
    if (!confirm('¿Quitar esta penalización de la lista? Las ya marcadas se quedan en el historial.')) return;
    const r = await act('deletePenaltyType', { typeId: d.id });
    if (r) penaltyListModal();
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el || !A[el.dataset.a]) return;
  A[el.dataset.a](el.dataset, e, el);
});

document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-submit]');
  if (!f) return;
  e.preventDefault();
  const name = f.dataset.submit;
  if (name === 'saveCode') {
    const v = ($('#code-inp').value || '').trim();
    if (!v) return;
    S.code = v; S.codeOpen = false;
    try { localStorage.setItem(KEY_CODE, v); } catch (err) {}
    closeModal(); refresh();
    return;
  }
  if (A[name]) A[name](f.dataset);
});

document.addEventListener('change', (e) => {
  if (e.target.closest('[data-submit="saveTask"]')) updateTaskPreview();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#modal-root').innerHTML && !S.codeOpen) closeModal();
});

/* =====================================================================
   Sincronización: al abrir y al volver a la app
   ===================================================================== */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh({ silent: true }); });
window.addEventListener('focus', () => refresh({ silent: true }));
window.addEventListener('online', () => refresh({ silent: true }));
window.addEventListener('pageshow', (e) => { if (e.persisted) refresh({ silent: true }); });

render();
refresh();
})();
</script>
</body>
</html>
