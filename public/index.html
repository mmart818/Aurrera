<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Gzn</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gzn">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Si el frontend se aloja en otro dominio que el Worker, pon aquí la URL del Worker, sin barra final. -->
<script>window.API_BASE = '';</script>

<style>
  :root{
    --bg:#fafaf9; --surface:#ffffff; --ink:#0a0a0a; --mute:#6b6b70; --line:#e8e8e6; --line-2:#cfcfcb; --fill:#f1f1ef;
    --accent:#4f46e5; --accent-l:#eeefff; --accent-ink:#ffffff;
    --danger:#b8420f; --danger-l:#fff0e8; --ok:#157a3c;
    --shadow:0 10px 30px rgba(0,0,0,.12);
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0b0c; --surface:#151517; --ink:#f5f5f4; --mute:#a1a1a6; --line:#26262a; --line-2:#3a3a40; --fill:#1e1e21;
      --accent:#8b93ff; --accent-l:#1c1d3a; --accent-ink:#0b0b0c;
      --danger:#ff9a66; --danger-l:#2b1a11; --ok:#4ade80;
      --shadow:0 10px 30px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; font-size:16px; line-height:1.45;
    color:var(--ink); background:var(--bg); min-height:100dvh; padding-bottom:calc(84px + var(--safe-b));
    -webkit-font-smoothing:antialiased; font-feature-settings:'cv11','ss01';
  }
  button{font-family:inherit;font-size:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  [hidden]{display:none!important}
  .ico{display:inline-block;vertical-align:-3px;flex:none}
  .coin{color:var(--accent)}

  /* ---------- Cabecera ---------- */
  .top{position:sticky;top:0;z-index:20;padding:calc(12px + var(--safe-t)) 20px 12px;
       background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .top-row{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-size:20px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
  .sync{font-size:12px;color:var(--mute);margin-top:2px}
  .sync.bad{color:var(--danger)}
  .pot{display:flex;align-items:baseline;gap:6px}
  .pot-num{font-size:30px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  .pot-lbl{font-size:13px;color:var(--mute);font-weight:500}
  .pot.bump{animation:bump .4s ease-out}
  @keyframes bump{40%{transform:scale(1.06)}}
  .iconbtn{background:none;border:0;padding:8px;min-width:44px;min-height:44px;border-radius:12px;cursor:pointer;color:var(--mute);display:flex;align-items:center;justify-content:center}
  .iconbtn:hover{background:var(--fill)}

  /* ---------- Contenido ---------- */
  .content{max-width:640px;margin:0 auto;padding:8px 20px 20px}
  .sec{font-size:13px;font-weight:600;color:var(--mute);margin:26px 0 8px}
  .bar-row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
  .grow{flex:1;min-width:0}
  .list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .item{display:flex;align-items:center;gap:8px;padding:2px 6px 2px 16px;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item.undone{opacity:.5}
  .r-main{flex:1;min-width:0;background:none;border:0;text-align:left;padding:14px 0;cursor:pointer;display:block}
  .r-title{display:block;font-weight:600;letter-spacing:-.01em;line-height:1.3}
  .r-meta{display:block;font-size:13px;color:var(--mute);margin-top:2px;line-height:1.4}
  .r-meta .acc{color:var(--accent);font-weight:600}
  .r-meta .pos{color:var(--ok);font-weight:600}
  .hint{font-size:14px;color:var(--mute);margin:6px 0}
  .note{margin:10px 0;padding:10px 12px;border-radius:12px;font-size:14px;background:var(--danger-l);color:var(--danger)}
  .empty{padding:28px 16px;text-align:center;color:var(--mute);font-size:14px}
  .empty b{display:block;color:var(--ink);font-size:16px;font-weight:600;margin-bottom:4px}
  .pos{color:var(--ok)} .neg{color:var(--danger)}

  /* Botón circular de completar */
  .check{width:48px;height:48px;border-radius:50%;background:none;border:0;display:grid;place-items:center;cursor:pointer;flex:none}
  .check::before{content:'';width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);transition:background .15s,border-color .15s}
  .check:hover::before{border-color:var(--accent)}
  .check:active::before{background:var(--accent);border-color:var(--accent)}

  /* ---------- Botones ---------- */
  .btn{min-height:44px;padding:10px 18px;border-radius:12px;border:0;background:var(--fill);color:var(--ink);font-weight:600;cursor:pointer;text-align:center;line-height:1.2}
  .btn:hover{filter:brightness(.97)}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-main{background:var(--ink);color:var(--bg)}
  .btn-accent{background:var(--accent);color:var(--accent-ink)}
  .btn-soft{background:var(--danger-l);color:var(--danger)}
  .btn-sm{min-height:38px;padding:6px 14px;font-size:14px;border-radius:10px}
  .link{background:none;border:0;padding:8px 6px;color:var(--mute);font-weight:500;font-size:13px;cursor:pointer;min-height:36px}
  .link:hover{color:var(--ink)}
  .link.acc{color:var(--accent);font-weight:600}

  .seg-tabs{display:inline-flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg-tabs button{border:0;background:none;padding:7px 14px;min-height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer}
  .seg-tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
  .toggle{border:0;background:none;color:var(--mute);font-weight:600;font-size:14px;cursor:pointer;padding:12px 0;min-height:44px;display:flex;align-items:center;gap:6px}
  .toggle[aria-pressed="true"]{color:var(--ink)}

  /* ---------- Recompensas ---------- */
  .rw{display:flex;gap:14px;align-items:flex-start;padding:16px;border-bottom:1px solid var(--line)}
  .rw:last-child{border-bottom:0}
  .rw-ico{font-size:24px;line-height:1;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--fill);flex:none}
  .bar{height:4px;border-radius:999px;background:var(--fill);margin:10px 0 6px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .5s ease}
  .bar.full > i{background:var(--ok)}
  .rw-actions{display:flex;gap:2px;align-items:center;margin:4px 0 0 -6px}

  /* ---------- Navegación ---------- */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);
       background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
       border-top:1px solid var(--line);padding:6px 12px calc(6px + var(--safe-b))}
  .nav button{background:none;border:0;border-radius:12px;min-height:54px;cursor:pointer;color:var(--mute);font-weight:600;font-size:12px;
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .nav button[aria-current="page"]{color:var(--accent)}

  /* ---------- Modales ---------- */
  .modal-back{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:560px){.modal-back{align-items:center}}
  .modal{width:100%;max-width:520px;max-height:94dvh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:22px 20px calc(20px + var(--safe-b));box-shadow:var(--shadow)}
  @media(min-width:560px){.modal{border-radius:24px}}
  .modal h2{margin:0 0 6px;font-size:20px;font-weight:700;letter-spacing:-.02em}
  .lbl{display:block;font-weight:600;font-size:13px;color:var(--mute);margin:16px 0 6px}
  .inp{width:100%;border:1px solid transparent;background:var(--fill);color:var(--ink);font:inherit;font-size:16px;padding:12px 14px;border-radius:12px}
  .inp:focus{outline:none;border-color:var(--accent)}
  textarea.inp{min-height:84px;resize:vertical}
  .seg-row{display:flex;gap:8px}
  .seg{flex:1;cursor:pointer;position:relative}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg span{display:block;text-align:center;border-radius:12px;background:var(--fill);padding:10px 4px;font-size:14px;font-weight:600;line-height:1.3;border:1px solid transparent}
  .seg input:checked + span{background:var(--surface);border-color:var(--ink)}
  .seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
  .seg small{display:block;font-size:12px;font-weight:500;color:var(--mute)}
  .chk{display:flex;align-items:center;gap:10px;font-weight:600;margin:16px 0 6px}
  .chk input{width:20px;height:20px;accent-color:var(--accent)}
  .icons{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
  .icons button{font-size:20px;line-height:1;padding:6px 0;border:1px solid transparent;border-radius:10px;background:var(--fill);cursor:pointer;min-height:40px}
  .icons button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
  .actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .actions .btn{flex:1;min-width:110px}
  .danger-row{display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .danger-row .btn{flex:1}
  .pick{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin-bottom:8px;text-align:left}

  /* ---------- Celebración ---------- */
  .party{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
  .party .box{position:relative;z-index:2;text-align:center;padding:28px 22px;max-width:380px;width:100%;background:var(--surface);border-radius:28px;box-shadow:var(--shadow)}
  .party .big{font-size:56px;line-height:1;margin-bottom:12px}
  .party h2{font-size:22px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
  .party p{margin:0 0 6px;color:var(--mute)}
  .confetti{position:absolute;inset:0;pointer-events:none;z-index:1}
  .confetti i{position:absolute;top:-16px;border-radius:2px;opacity:.9;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(300deg)}}

  /* ---------- Avisos ---------- */
  #toast-root{position:fixed;left:0;right:0;bottom:calc(80px + var(--safe-b));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
  .toast{pointer-events:auto;max-width:480px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 16px;border-radius:14px;
         background:var(--ink);color:var(--bg);box-shadow:var(--shadow);font-weight:500;font-size:15px;animation:rise .2s ease-out}
  .toast button{background:transparent;border:0;color:inherit;font-weight:700;padding:8px 12px;border-radius:10px;cursor:pointer;min-height:36px;flex:none;text-decoration:underline}
  .toast span{padding:6px 0}
  @keyframes rise{from{transform:translateY(8px);opacity:0}}

  /* ---------- Historial ---------- */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .stats div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .stats span{display:block;font-size:13px;color:var(--mute);font-weight:500}
  .stats b{display:block;font-size:28px;font-weight:700;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
  .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:10px}

  @media (prefers-reduced-motion: reduce){
    .confetti{display:none} .pot.bump,.toast{animation:none} .bar > i,.check::before{transition:none}
  }
</style>
</head>

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   Constantes y estado
   ===================================================================== */
const API_BASE = String(window.API_BASE || '').replace(/\/$/, '');
const KEY_CODE = 'gzn.code';
const DIFF = {
  easy:   { label: 'Fácil',   coins: 10 },
  medium: { label: 'Media',   coins: 25 },
  hard:   { label: 'Difícil', coins: 50 },
};
const ICONS = ['🏊','🌊','🏃','🚴','🏋️','🧘','👟','🎒','🍰','🍫','🍕','🍣','☕','🍷','🛍️','🎨','🧶','📚','🎧','🎮','🎬','🎟️','🌅','🏖️','🧳','🛁','🕯️','🪴','🎁','🎉','📷','🍦'];
const NAV_ICONS = {
  tasks: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  rewards: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
  history: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
};

const S = {
  state: null, tab: 'tasks', filter: 'all', rview: 'active', hview: 'tasks',
  showDone: false, showArch: false,
  busy: false, loading: false, online: true, lastSync: null,
  code: '', shown: null, error: null, codeOpen: false,
};
try { S.code = localStorage.getItem(KEY_CODE) || ''; } catch (e) { /* sin almacenamiento: funciona igual */ }

/* =====================================================================
   Utilidades
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n) => `${n} ${n === 1 ? 'moneda' : 'monedas'}`;
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
const fmtDay = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }); };
const fmtDT = (iso) => new Date(iso).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const monthLabel = (iso) => new Date(iso).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
const bonusCoins = (t) => Math.round(DIFF[t.difficulty].coins * (1 + t.bonusPct / 100));
const svgIcon = (inner, px = 22) => `<svg width="${px}" height="${px}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const coin = (px = 14) => `<svg class="ico coin" width="${px}" height="${px}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="3.6" fill="currentColor"/></svg>`;

/* =====================================================================
   API
   ===================================================================== */
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (S.code) headers['X-App-Code'] = S.code;
  if (location.protocol === 'file:' && !API_BASE) {
    const er = new Error('Abre la app desde su URL de Cloudflare, no como archivo local (hace falta la API).'); er.code = 'net'; throw er;
  }
  let res;
  try {
    res = await fetch(API_BASE + path, { ...opts, headers, cache: 'no-store' });
  } catch (e) {
    const er = new Error('Sin conexión con el servidor'); er.code = 'net'; throw er;
  }
  let data = null;
  try { data = await res.json(); } catch (e) { /* sin cuerpo */ }
  if (res.status === 401) {
    openCodeModal();
    const er = new Error('Hace falta el código de acceso'); er.code = 'auth'; throw er;
  }
  if (!res.ok) {
    let msg = data && data.error;
    if (!msg && res.status === 404) msg = 'No se encuentra la API (/api/state). Esta URL solo sirve la página: falta desplegar el Worker o la Pages Function (mira el README).';
    const er = new Error(msg || `Error ${res.status}`); er.code = 'http'; throw er;
  }
  return data;
}

function describe(h) {
  switch (h.type) {
    case 'completed':          return `Completaste «${h.title}» (+${plural(h.coins)})${h.undone ? ' (deshecha)' : ''}`;
    case 'completion_undone':  return `Deshiciste «${h.title}» (−${plural(h.coins)})`;
    case 'redeemed':           return `Canjeaste «${h.title}» (−${plural(h.coins)})${h.undone ? ' (deshecho)' : ''}`;
    case 'redeem_undone':      return `Deshiciste el canje de «${h.title}» (+${plural(h.coins)})`;
    case 'penalized':          return `Penalización: «${h.title}» (−${h.applied}${h.applied < h.coins ? ', el bote llegó a 0' : ''})${h.undone ? ' (deshecha)' : ''}`;
    case 'penalty_undone':     return `Deshiciste la penalización «${h.title}» (+${plural(h.coins)})`;
    default: return h.title || '';
  }
}

function applyState(st) {
  const prev = S.state;
  if (prev && st.version < prev.version) return; // respuesta más antigua que la que ya tenemos
  const changed = !prev || prev.version !== st.version;
  S.state = st; S.error = null;
  if (changed) render();
}

async function refresh({ silent = false } = {}) {
  if (S.loading) return;
  S.loading = true;
  try {
    const res = await api('/api/state?_=' + Date.now());
    S.online = true; S.lastSync = new Date();
    applyState(res.state);
  } catch (err) {
    S.online = false;
    if (err.code === 'auth') { /* se abre el modal de código */ }
    else if (!S.state) { S.error = err.message; render(); }
    else if (!silent) toast(err.message);
  } finally {
    S.loading = false; updateSync();
  }
}

async function act(action, payload = {}) {
  if (S.busy) return null;
  S.busy = true;
  try {
    const res = await api('/api/action', { method: 'POST', body: JSON.stringify({ action, payload }) });
    S.online = true; S.lastSync = new Date();
    applyState(res.state); updateSync();
    return res.result || {};
  } catch (err) {
    if (err.code !== 'auth') toast(err.message || 'No se pudo completar la acción');
    S.busy = false;
    refresh({ silent: true });
    return null;
  } finally {
    S.busy = false;
  }
}

/* =====================================================================
   Render
   ===================================================================== */
function render() {
  const root = $('#app');
  if (!S.state) {
    root.innerHTML = `<main class="content" style="text-align:center;padding-top:96px">
      <h1 style="font-size:32px;font-weight:700;letter-spacing:-.04em;margin:0 0 8px">Gzn</h1>
      <p class="hint">${S.error ? esc(S.error) : 'Cargando…'}</p>
      ${S.error ? '<button class="btn btn-main" data-a="refresh">Reintentar</button>' : ''}</main>`;
    return;
  }
  root.innerHTML = renderHeader() + `<main class="content" id="content">${renderTab()}</main>` + renderNav();
  animatePot(); updateSync();
}

function renderHeader() {
  return `<header class="top"><div class="top-row">
    <div><div class="brand">Gzn</div><div class="sync" id="sync"></div></div>
    <div style="display:flex;align-items:center;gap:6px">
      <button class="iconbtn" data-a="refresh" aria-label="Actualizar ahora">${svgIcon('<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>', 20)}</button>
      <div class="pot" id="pot-box">${coin(16)}<span class="pot-num" id="pot-num" aria-label="Monedas en el bote">${S.shown ?? S.state.coins}</span><span class="pot-lbl">monedas</span></div>
    </div></div></header>`;
}

function renderNav() {
  const tabs = [['tasks', 'Tareas'], ['rewards', 'Premios'], ['history', 'Historial']];
  return `<nav class="nav" aria-label="Secciones">${tabs.map(([k, l]) =>
    `<button data-a="tab" data-t="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${svgIcon(NAV_ICONS[k], 22)}<span>${l}</span></button>`).join('')}</nav>`;
}

function renderTab() {
  return S.tab === 'rewards' ? renderRewards() : S.tab === 'history' ? renderHistory() : renderTasks();
}

function updateSync() {
  const el = $('#sync');
  if (!el) return;
  if (!S.online) { el.className = 'sync bad'; el.textContent = 'Sin conexión, reintentando…'; return; }
  el.className = 'sync';
  el.textContent = S.lastSync ? `Guardado ${S.lastSync.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}` : 'Sincronizando…';
}

let tweenId = 0;
function animatePot() {
  const el = $('#pot-num');
  if (!el) return;
  const id = ++tweenId; // cualquier animación anterior queda cancelada
  const to = S.state.coins;
  const from = S.shown ?? to;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (from === to || reduce) { el.textContent = to; S.shown = to; return; }
  const box = $('#pot-box'); box.classList.remove('bump'); void box.offsetWidth; box.classList.add('bump');
  const t0 = performance.now(), dur = 600;
  const step = (now) => {
    if (id !== tweenId) return;
    const k = Math.min(1, (now - t0) / dur);
    const val = Math.round(from + (to - from) * k);
    S.shown = val;
    const node = $('#pot-num'); if (node) node.textContent = val;
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------------------------- Tareas ---------------------------- */
function taskMeta(t) {
  const d = DIFF[t.difficulty];
  const bits = [`${d.label}`, `<span class="acc">${coin(12)} ${d.coins}</span>`, t.type === 'recurring' ? 'Recurrente' : 'Puntual'];
  if (t.type === 'once' && t.deadline && t.bonusPct > 0) {
    bits.push(todayStr() > t.deadline
      ? `Plazo vencido el ${fmtDay(t.deadline)}`
      : `<span class="acc">hasta el ${fmtDay(t.deadline)}: ${bonusCoins(t)}</span>`);
  }
  if (t.doneCount) bits.push(`${t.doneCount}×`);
  return bits.join(' · ');
}

function taskRow(t, mode) {
  const title = `<span class="r-title">${esc(t.title)}</span><span class="r-meta">${taskMeta(t)}</span>`;
  if (mode === 'avail') {
    return `<div class="item"><button class="r-main" data-a="editTask" data-id="${t.id}" aria-label="Editar ${esc(t.title)}">${title}</button>
      <button class="check" data-a="complete" data-id="${t.id}" aria-label="Marcar «${esc(t.title)}» como hecha"></button></div>`;
  }
  const btns = mode === 'done'
    ? `<button class="link" data-a="reopen" data-id="${t.id}">Reabrir</button><button class="link" data-a="archiveTask" data-id="${t.id}">Archivar</button>`
    : `<button class="link acc" data-a="unarchiveTask" data-id="${t.id}">Reactivar</button><button class="link" data-a="editTask" data-id="${t.id}">Editar</button>`;
  return `<div class="item"><div class="r-main" style="cursor:default">${title}</div>${btns}</div>`;
}

function renderTasks() {
  const all = S.state.tasks;
  const live = all.filter((t) => !t.archived);
  const done = live.filter((t) => t.status === 'done');
  const archived = all.filter((t) => t.archived);
  const avail = live.filter((t) => t.status === 'available' && (S.filter === 'all' || t.difficulty === S.filter))
    .map((t, i) => ({ t, i }))
    .sort((a, b) => {
      const da = a.t.deadline && a.t.bonusPct > 0 ? a.t.deadline : '9999';
      const db = b.t.deadline && b.t.bonusPct > 0 ? b.t.deadline : '9999';
      return da === db ? a.i - b.i : da < db ? -1 : 1;
    }).map((x) => x.t);
  const tab = (k, l) => `<button data-a="filter" data-f="${k}" aria-pressed="${S.filter === k}">${l}</button>`;
  return `
    <div class="bar-row">
      <div class="seg-tabs" role="group" aria-label="Filtrar por dificultad">${tab('all', 'Todas')}${tab('easy', 'Fácil')}${tab('medium', 'Media')}${tab('hard', 'Difícil')}</div>
    </div>
    <div class="bar-row" style="margin-top:12px;justify-content:flex-start">
      <button class="btn btn-main btn-sm" data-a="newTask">Nueva tarea</button>
      <button class="btn btn-soft btn-sm" data-a="penalty">Penalizar</button>
    </div>
    <div class="sec">Por hacer (${avail.length})</div>
    ${avail.length ? `<div class="list">${avail.map((t) => taskRow(t, 'avail')).join('')}</div>`
      : `<div class="list"><div class="empty"><b>Nada pendiente</b>${S.filter === 'all' ? 'No quedan tareas disponibles. Crea una nueva o reabre una completada.' : 'No hay tareas con esta dificultad.'}</div></div>`}
    ${done.length ? `<button class="toggle" data-a="toggleDone" aria-pressed="${S.showDone}">${S.showDone ? '▾' : '▸'} Completadas (${done.length})</button>
       ${S.showDone ? `<div class="list">${done.map((t) => taskRow(t, 'done')).join('')}</div>` : ''}` : ''}
    ${archived.length ? `<button class="toggle" data-a="toggleArch" aria-pressed="${S.showArch}">${S.showArch ? '▾' : '▸'} Archivadas (${archived.length})</button>
       ${S.showArch ? `<div class="list">${archived.map((t) => taskRow(t, 'archived')).join('')}</div>` : ''}` : ''}`;
}

/* ---------------------------- Recompensas ---------------------------- */
function rewardRow(r) {
  const have = S.state.coins, missing = Math.max(0, r.cost - have);
  const pct = Math.min(100, Math.round((have / r.cost) * 100));
  const ok = missing === 0;
  const times = r.timesRedeemed ? `Disfrutada ${r.timesRedeemed} ${r.timesRedeemed === 1 ? 'vez' : 'veces'}` : '';
  if (r.archived) {
    return `<div class="rw"><div class="rw-ico" aria-hidden="true">${esc(r.icon)}</div><div class="grow">
      <span class="r-title">${esc(r.title)}</span><span class="r-meta"><span class="acc">${coin(12)} ${r.cost}</span>${times ? ` · ${times}` : ''}</span>
      <div class="rw-actions"><button class="link acc" data-a="unarchiveReward" data-id="${r.id}">Reactivar</button><button class="link" data-a="editReward" data-id="${r.id}">Editar</button></div></div></div>`;
  }
  return `<div class="rw"><div class="rw-ico" aria-hidden="true">${esc(r.icon)}</div><div class="grow">
      <span class="r-title">${esc(r.title)}</span>
      ${r.description ? `<span class="r-meta">${esc(r.description)}</span>` : ''}
      <div class="bar ${ok ? 'full' : ''}" role="progressbar" aria-valuemin="0" aria-valuemax="${r.cost}" aria-valuenow="${Math.min(have, r.cost)}" aria-label="Progreso"><i style="width:${pct}%"></i></div>
      <span class="r-meta"><span class="acc">${coin(12)} ${r.cost}</span> · ${ok ? '<span class="pos">Lista para canjear</span>' : `faltan ${r.cost - have}`}${times ? ` · ${times}` : ''}</span>
      <div class="rw-actions"><button class="link" data-a="editReward" data-id="${r.id}">Editar</button><button class="link" data-a="archiveReward" data-id="${r.id}">Archivar</button></div></div>
    <button class="btn ${ok ? 'btn-accent' : ''} btn-sm" data-a="redeem" data-id="${r.id}" ${ok ? '' : 'disabled'}>Canjear</button></div>`;
}

function renderRewards() {
  const act_ = S.state.rewards.filter((r) => !r.archived).sort((a, b) => a.cost - b.cost);
  const arch = S.state.rewards.filter((r) => r.archived).sort((a, b) => a.cost - b.cost);
  const list = S.rview === 'active' ? act_ : arch;
  const tab = (k, l) => `<button data-a="rview" data-v="${k}" aria-pressed="${S.rview === k}">${l}</button>`;
  return `<div class="bar-row">
      <div class="seg-tabs" role="group">${tab('active', `Activas (${act_.length})`)}${tab('archived', `Archivadas (${arch.length})`)}</div>

    </div>

    ${list.length ? `<div class="list">${list.map((r) => rewardRow(r)).join('')}</div>`
      : `<div class="list"><div class="empty"><b>${S.rview === 'active' ? 'Sin recompensas activas' : 'Nada archivado'}</b>${S.rview === 'active' ? 'Añade una o reactiva alguna archivada.' : 'Las recompensas que archives aparecerán aquí.'}</div></div>`}`;
}

/* ---------------------------- Historial ---------------------------- */
function renderCompletions() {
  const list = S.state.completions || [];
  if (!list.length) return `<div class="list"><div class="empty"><b>Aún no hay tareas completadas</b>Cada tarea que completes quedará registrada aquí.</div></div>`;
  let html = '';
  let cur = null, rows = '', sum = 0, n = 0;
  const flush = () => { if (cur !== null) html += `<div class="sec">${esc(cur)} · ${n} ${n === 1 ? 'tarea' : 'tareas'} · +${sum}</div><div class="list">${rows}</div>`; };
  list.forEach((c) => {
    const m = monthLabel(c.at);
    if (m !== cur) { flush(); cur = m; rows = ''; sum = 0; n = 0; }
    if (c.undone) {
      rows += `<div class="item undone"><div class="r-main" style="cursor:default"><span class="r-title"><s>${esc(c.title)}</s></span><span class="r-meta">Deshecha · ${fmtDT(c.at)}</span></div></div>`;
    } else {
      sum += c.coins; n += 1;
      rows += `<div class="item"><div class="r-main" style="cursor:default"><span class="r-title">${esc(c.title)}</span>
        <span class="r-meta">${fmtDT(c.at)}${c.onTime ? ' · con bonus a tiempo' : ''}</span></div>
        <button class="link" data-a="undoComplete" data-id="${c.id}">Deshacer</button><span class="amt pos">+${c.coins}</span></div>`;
    }
  });
  flush();
  return html;
}

function renderRedemptions() {
  const list = S.state.redemptions || [];
  if (!list.length) return `<div class="list"><div class="empty"><b>Aún no has canjeado nada</b>Las recompensas que canjees quedarán aquí, con opción de deshacer.</div></div>`;
  const rows = list.map((r) => r.undone
    ? `<div class="item undone"><div class="r-main" style="cursor:default"><span class="r-title"><s>${esc(r.icon || '🎁')} ${esc(r.title)}</s></span><span class="r-meta">Deshecho · las monedas volvieron al bote</span></div></div>`
    : `<div class="item"><div class="r-main" style="cursor:default"><span class="r-title">${esc(r.icon || '🎁')} ${esc(r.title)}</span><span class="r-meta">${fmtDT(r.at)}</span></div>
        <button class="link" data-a="undoRedeem" data-id="${r.id}">Deshacer</button><span class="amt neg">−${r.coins}</span></div>`).join('');
  return `<div class="sec">Canjes</div><div class="list">${rows}</div>`;
}

function renderPenalties() {
  const list = S.state.penalties || [];
  if (!list.length) return `<div class="list"><div class="empty"><b>Sin penalizaciones</b>Las que marques quedarán aquí, con opción de deshacer.</div></div>`;
  const rows = list.map((p) => p.undone
    ? `<div class="item undone"><div class="r-main" style="cursor:default"><span class="r-title"><s>${esc(p.title)}</s></span><span class="r-meta">Deshecha · volvieron ${plural(p.applied)} al bote</span></div></div>`
    : `<div class="item"><div class="r-main" style="cursor:default"><span class="r-title">${esc(p.title)}</span>
        <span class="r-meta">${fmtDT(p.at)}${p.applied < p.amount ? ` · solo se restó lo que había (${p.applied})` : ''}</span></div>
        <button class="link" data-a="undoPenalty" data-id="${p.id}">Deshacer</button><span class="amt neg">−${p.applied}</span></div>`).join('');
  return `<div class="sec">Penalizaciones · total ${S.state.totals.penalized || 0}</div><div class="list">${rows}</div>`;
}

function renderActivity() {
  const items = S.state.history;
  const amt = (h) => h.type === 'completed' ? `<span class="amt pos">+${h.coins}</span>`
    : h.type === 'redeemed' ? `<span class="amt neg">−${h.coins}</span>`
    : h.type === 'penalized' ? `<span class="amt neg">−${h.applied}</span>`
    : h.type === 'completion_undone' ? `<span class="amt neg">−${h.coins}</span>`
    : `<span class="amt pos">+${h.coins}</span>`;
  return `<div class="sec">Actividad reciente</div><div class="list">${items.length ? items.map((h) => `<div class="item"><div class="r-main" style="cursor:default">
      <span class="r-title" style="font-weight:500">${esc(describe(h))}</span><span class="r-meta">${fmtDT(h.at)}</span></div>${amt(h)}</div>`).join('')
    : '<div class="empty"><b>Aún no hay nada</b>Aquí quedará tu actividad.</div>'}</div>`;
}

function renderHistory() {
  const st = S.state;
  const tab = (k, l) => `<button data-a="hview" data-v="${k}" aria-pressed="${S.hview === k}">${l}</button>`;
  const body = S.hview === 'rewards' ? renderRedemptions() : S.hview === 'penalties' ? renderPenalties()
    : S.hview === 'activity' ? renderActivity() : renderCompletions();
  return `<div class="stats">
      <div><span>Ganadas</span><b class="pos">${st.totals.earned}</b></div>
      <div><span>Gastadas</span><b>${st.totals.spent}</b></div></div>
    <div class="bar-row"><div class="seg-tabs" role="group">${tab('tasks', 'Tareas')}${tab('rewards', 'Premios')}${tab('penalties', 'Penaliz.')}${tab('activity', 'Actividad')}</div></div>
    ${body}`;
}

  const colors = ['#4f46e5', '#8b93ff', '#0a0a0a', '#cfcfcb', '#f59e0b'];
  const bits = Array.from({ length: 30 }, () =>
    `<i style="left:${Math.random() * 100}%;background:${colors[Math.floor(Math.random() * colors.length)]};width:${5 + Math.random() * 6}px;height:${8 + Math.random() * 8}px;animation-duration:${(2 + Math.random() * 2).toFixed(2)}s;animation-delay:${(Math.random() * 0.8).toFixed(2)}s"></i>`).join('');
  openModal(`<div class="party" role="dialog" aria-modal="true" aria-labelledby="party-t"><div class="confetti" aria-hidden="true">${bits}</div>
    <div class="box"><div class="big" aria-hidden="true">${esc(reward.icon)}</div>
    <h2 id="party-t">¡Recompensa lograda!</h2><p>A disfrutar: «${esc(reward.title)}»</p>
    <div class="actions"><button class="btn btn-main" data-a="closeModal">A disfrutar</button>
    <button class="btn btn-sm" data-a="partyArchive" data-id="${reward.id}">Archivarla</button></div>
    <div style="margin-top:8px"><button class="link" data-a="undoNow" data-id="${redemptionId}">Me he equivocado: deshacer canje</button></div></div></div>`);
}

/* =====================================================================
   Avisos
   ===================================================================== */
function toast(msg, action = null) {
  const el = document.createElement('div');
  el.className = 'toast';
  const span = document.createElement('span'); span.textContent = msg; el.appendChild(span);
  if (action) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label;
    b.addEventListener('click', () => { el.remove(); action.fn(); });
    el.appendChild(b);
  }
  const root = $('#toast-root');
  root.innerHTML = ''; // un solo aviso a la vez: el nuevo sustituye al anterior (el deshacer sigue en Historial)
  root.appendChild(el);
  setTimeout(() => el.remove(), action ? 7000 : 4200);
}

/* =====================================================================
   Acciones de la interfaz
   ===================================================================== */
async function doUndoComplete(id) {
  const r = await act('undoComplete', { completionId: id });
  if (r) toast(`Tarea deshecha: −${plural(r.coins)}`);
}

const A = {
  refresh() { refresh(); },
  tab(d) { S.tab = d.t; render(); window.scrollTo(0, 0); refresh({ silent: true }); },
  filter(d) { S.filter = d.f; render(); },
  rview(d) { S.rview = d.v; render(); },
  hview(d) { S.hview = d.v; render(); },
  toggleDone() { S.showDone = !S.showDone; render(); },
  toggleArch() { S.showArch = !S.showArch; render(); },
  closeModal() { closeModal(); },
  backdrop(d, e, el) { if (e.target === el) closeModal(); },

  async complete(d) {
    const r = await act('completeTask', { taskId: d.id });
    if (r) toast(`+${plural(r.coins)}`, { label: 'Deshacer', fn: () => doUndoComplete(r.completionId) });
  },
  async undoComplete(d) {
    if (!confirm('¿Deshacer esta tarea? Se restan sus monedas del bote.')) return;
    await doUndoComplete(d.id);
  },

  newTask() { taskModal(null); },
  editTask(d) { taskModal(d.id); },
  async saveTask(d) {
    const title = ($('#f-title').value || '').trim();
    if (!title) { toast('Ponle un nombre a la tarea.'); return; }
    const type = $('input[name=f-type]:checked').value;
    const task = { id: d.id || undefined, title, difficulty: $('input[name=f-diff]:checked').value, type, deadline: null, bonusPct: 0 };
    if (type === 'once' && $('#f-hasdl').checked) {
      const date = $('#f-date').value;
      if (!date) { toast('Elige la fecha límite o desmarca el bonus.'); return; }
      task.deadline = date; task.bonusPct = Number($('#f-bonus').value) || 0;
    }
    const r = await act('saveTask', { task });
    if (r) { closeModal(); toast('Tarea guardada'); }
  },
  async archiveTask(d) { await act('archiveTask', { taskId: d.id, archived: true }); },
  async unarchiveTask(d) { await act('archiveTask', { taskId: d.id, archived: false }); },
  async archiveFromModal(d) { const r = await act('archiveTask', { taskId: d.id, archived: true }); if (r) closeModal(); },
  async reopen(d) { await act('reopenTask', { taskId: d.id }); },
  async deleteTask(d) {
    if (!confirm('¿Eliminar esta tarea para siempre? Si solo quieres quitarla de la lista, usa Archivar.')) return;
    const r = await act('deleteTask', { taskId: d.id }); if (r) closeModal();
  },

  newReward() { rewardModal(null); },
  editReward(d) { rewardModal(d.id); },
  pickIcon(d) {
    $('#r-icon').value = d.i;
    document.querySelectorAll('.icons button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.i === d.i)));
  },
  async saveReward(d) {
    const title = ($('#r-title').value || '').trim();
    const cost = Number($('#r-cost').value);
    if (!title) { toast('Ponle un título a la recompensa.'); return; }
    if (!Number.isFinite(cost) || cost < 1) { toast('El coste tiene que ser de 1 moneda o más.'); return; }
    const r = await act('saveReward', { reward: { id: d.id || undefined, icon: ($('#r-icon').value || '🎁').trim(), title, description: $('#r-desc').value, cost } });
    if (r) { closeModal(); toast('Recompensa guardada'); }
  },
  async archiveReward(d) { await act('archiveReward', { rewardId: d.id, archived: true }); },
  async unarchiveReward(d) { await act('archiveReward', { rewardId: d.id, archived: false }); },
  async archiveRewardFromModal(d) {
    const cur = S.state.rewards.find((x) => x.id === d.id);
    const r = await act('archiveReward', { rewardId: d.id, archived: !cur.archived }); if (r) closeModal();
  },
  async deleteReward(d) {
    if (!confirm('¿Eliminar esta recompensa para siempre? Si quieres guardarla para más adelante, usa Archivar.')) return;
    const r = await act('deleteReward', { rewardId: d.id }); if (r) closeModal();
  },
  async redeem(d) {
    const r = await act('redeemReward', { rewardId: d.id });
    if (r && r.reward) celebrate(r.reward, r.redemptionId);
  },
  async undoRedeem(d) {
    if (!confirm('¿Deshacer este canje? Las monedas vuelven al bote.')) return;
    const r = await act('undoRedeem', { redemptionId: d.id });
    if (r) toast(`Canje deshecho: +${plural(r.coins)}`);
  },
  async undoNow(d) {
    const r = await act('undoRedeem', { redemptionId: d.id });
    if (r) { closeModal(); toast(`Canje deshecho: +${plural(r.coins)}`); }
  },
  async partyArchive(d) { closeModal(); await act('archiveReward', { rewardId: d.id, archived: true }); },

  penalty() { penaltyPickModal(); },
  penaltyList() { penaltyListModal(); },
  newPenaltyType() { penaltyTypeModal(null); },
  editPenaltyType(d) { penaltyTypeModal(d.id); },
  async applyPenalty(d) {
    const r = await act('applyPenalty', { typeId: d.id });
    if (!r) return;
    closeModal();
    if (r.applied > 0) toast(`−${plural(r.applied)}`, { label: 'Deshacer', fn: async () => {
      const u = await act('undoPenalty', { penaltyId: r.penaltyId });
      if (u) toast(`Penalización deshecha: +${plural(u.applied)}`);
    } });
    else toast('El bote ya estaba a 0');
  },
  async undoPenalty(d) {
    if (!confirm('¿Deshacer esta penalización? Las monedas vuelven al bote.')) return;
    const r = await act('undoPenalty', { penaltyId: d.id });
    if (r) toast(`Penalización deshecha: +${plural(r.applied)}`);
  },
  async savePenaltyType(d) {
    const title = ($('#pt-title').value || '').trim();
    if (!title) { toast('Ponle un nombre a la penalización.'); return; }
    const r = await act('savePenaltyType', { type: { id: d.id || undefined, title, difficulty: $('input[name=pt-diff]:checked').value } });
    if (r) { penaltyListModal(); toast('Penalización guardada'); }
  },
  async deletePenaltyType(d) {
    if (!confirm('¿Quitar esta penalización de la lista? Las ya marcadas se quedan en el historial.')) return;
    const r = await act('deletePenaltyType', { typeId: d.id });
    if (r) penaltyListModal();
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el || !A[el.dataset.a]) return;
  A[el.dataset.a](el.dataset, e, el);
});

document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-submit]');
  if (!f) return;
  e.preventDefault();
  const name = f.dataset.submit;
  if (name === 'saveCode') {
    const v = ($('#code-inp').value || '').trim();
    if (!v) return;
    S.code = v; S.codeOpen = false;
    try { localStorage.setItem(KEY_CODE, v); } catch (err) {}
    closeModal(); refresh();
    return;
  }
  if (A[name]) A[name](f.dataset);
});

document.addEventListener('change', (e) => {
  if (e.target.closest('[data-submit="saveTask"]')) updateTaskPreview();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#modal-root').innerHTML && !S.codeOpen) closeModal();
});

/* =====================================================================
   Sincronización: al abrir y al volver a la app
   ===================================================================== */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh({ silent: true }); });
window.addEventListener('focus', () => refresh({ silent: true }));
window.addEventListener('online', () => refresh({ silent: true }));
window.addEventListener('pageshow', (e) => { if (e.persisted) refresh({ silent: true }); });

render();
refresh();
})();
</script>
</body>
</html>
